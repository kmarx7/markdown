## 기능 리스트
- **실시간 서식 변환**: 복사 시 HTML/RTF로 즉시 재포맷팅
- *자동 감지*: 클립보드 안의 마크다운 구문을 스스로 식별
- 코드 구문 강조: 다크 테마 기반 코드 서식 제공

> 마크다운 텍스트를 Pages나 Word 등에 붙여넣을 때 서식이 그대로 유지됩니다!

  <script>
    // --- State Variables ---
    let isEnabled = true;
    let autoDetect = true;
    let notifyOnChange = true;
    
    const markdownInput = document.getElementById('markdownInput');
    const htmlPreview = document.getElementById('htmlPreview');
    const appMenuButton = document.getElementById('appMenuButton');
    const appDropdown = document.getElementById('appDropdown');
    const notificationCenter = document.getElementById('notificationCenter');
    const realCopyButton = document.getElementById('realCopyButton');
    const formatNowButton = document.getElementById('formatNowButton');
    
    // Toggle Settings
    const toggleEnabledBtn = document.getElementById('toggleEnabled');
    const toggleAutoDetectBtn = document.getElementById('toggleAutoDetect');
    const toggleNotificationsBtn = document.getElementById('toggleNotifications');
    const quitButton = document.getElementById('quitButton');
    const shutdownOverlay = document.getElementById('shutdownOverlay');

    // System Time Clock
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      minutes = minutes < 10 ? '0'+minutes : minutes;
      document.getElementById('macTime').innerText = `${hours}:${minutes} ${ampm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Dropdown toggling
    appMenuButton.addEventListener('click', (e) => {
      e.stopPropagation();
      appDropdown.classList.toggle('show');
      appMenuButton.classList.toggle('active');
    });

    document.addEventListener('click', () => {
      appDropdown.classList.remove('show');
      appMenuButton.classList.remove('active');
    });

    appDropdown.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    // Checkbox Menu Items Action
    toggleEnabledBtn.addEventListener('click', () => {
      isEnabled = !isEnabled;
      toggleEnabledBtn.classList.toggle('checked', isEnabled);
      showToast("설정 변경", `자동 클립보드 서식 변환이 ${isEnabled ? '활성화' : '비활성화'} 되었습니다.`);
      runProcessor(false);
    });

    toggleAutoDetectBtn.addEventListener('click', () => {
      autoDetect = !autoDetect;
      toggleAutoDetectBtn.classList.toggle('checked', autoDetect);
      showToast("설정 변경", `마크다운 자동 감지가 ${autoDetect ? '활성화' : '비활성화'} 되었습니다.`);
      runProcessor(false);
    });

    toggleNotificationsBtn.addEventListener('click', () => {
      notifyOnChange = !notifyOnChange;
      toggleNotificationsBtn.classList.toggle('checked', notifyOnChange);
      showToast("설정 변경", `알림 배너 노출이 ${notifyOnChange ? '활성화' : '비활성화'} 되었습니다.`);
    });

    formatNowButton.addEventListener('click', () => {
      appDropdown.classList.remove('show');
      appMenuButton.classList.remove('active');
      runProcessor(true);
    });

    quitButton.addEventListener('click', () => {
      appDropdown.classList.remove('show');
      appMenuButton.classList.remove('active');
      shutdownOverlay.classList.add('active');
      setTimeout(() => {
        shutdownOverlay.innerHTML = '<p style="font-size: 16px; font-weight: 500;">앱이 종료되었습니다. 페이지를 새로고침하여 다시 켤 수 있습니다.</p>';
      }, 1500);
    });

    // Toast Notification Dispatcher
    function showToast(title, body) {
      if (!notifyOnChange) return;
      
      const toast = document.createElement('div');
      toast.className = 'notification';
      toast.innerHTML = `
        <div class="notification-icon">📝</div>
        <div class="notification-content">
          <div class="notification-title">${title}</div>
          <div class="notification-body">${body}</div>
        </div>
      `;
      notificationCenter.appendChild(toast);
      
      // Trigger slide-in
      setTimeout(() => toast.classList.add('show'), 50);
      
      // Auto dismiss after 4 seconds
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 400);
      }, 4000);
    }

    // --- Markdown to HTML Conversion Logic ---
    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function isProbablyMarkdown(text) {
      const lines = text.split('\n');
      let indicators = 0;
      let inCodeBlock = false;

      for (let line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith('```')) {
          inCodeBlock = !inCodeBlock;
          indicators++;
          continue;
        }
        if (inCodeBlock) continue;

        if (trimmed.startsWith('# ') || trimmed.startsWith('## ') || trimmed.startsWith('### ') || trimmed.startsWith('#### ')) {
          indicators++;
        }
        if (trimmed.startsWith('- ') || trimmed.startsWith('* ') || trimmed.startsWith('+ ')) {
          indicators++;
        }
        if (trimmed.startsWith('> ')) {
          indicators++;
        }
        
        // Ordered List Check
        if (/^\d+\.\s/.test(trimmed)) {
          indicators++;
        }
      }

      if (text.includes('`') && text.split('`').length >= 3) indicators++;
      if (text.includes('**') && text.split('**').length >= 3) indicators++;
      if (text.includes('__') && text.split('__').length >= 3) indicators++;
      if (/\[[^\]]+\]\([^)]+\)/.test(text)) indicators++;

      return indicators >= 1;
    }

    function parseInlineMarkdown(text) {
      let result = text;
      let codeBlocks = [];

      // 1. Inline code: `code`
      const codeRegex = /`([^`]+)`/g;
      let match;
      let matchCount = 0;
      while ((match = codeRegex.exec(result)) !== null) {
        codeBlocks.push(match[1]);
        const token = `___INLINE_CODE_TOKEN_${matchCount}___`;
        result = result.replace(match[0], token);
        matchCount++;
        codeRegex.lastIndex = 0; // Reset search position due to replacement
      }

      // 2. Links: [text](url) -> <a href="url" target="_blank">text</a>
      result = result.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

      // 3. Bold: **text** and __text__
      result = result.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      result = result.replace(/__([^_]+)__/g, '<strong>$1</strong>');

      // 4. Italic: *text* and _text_
      result = result.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      result = result.replace(/_([^_]+)_/g, '<em>$1</em>');

      // 5. Restore code tokens
      for (let i = 0; i < codeBlocks.length; i++) {
        const token = `___INLINE_CODE_TOKEN_${i}___`;
        result = result.replace(token, `<code>${codeBlocks[i]}</code>`);
      }

      return result;
    }

    function highlightSyntax(code, language) {
      if (!language || ['txt', 'text', 'plaintext', 'md', 'markdown'].includes(language)) {
        return code;
      }

      let result = code;
      let commentTokens = [];
      let stringTokens = [];

      // 1. Extract block comments
      const blockCommentRegex = /\/\*[\s\S]*?\*\//g;
      let bCount = 0;
      result = result.replace(blockCommentRegex, (match) => {
        commentTokens.push(match);
        return `___BLOCK_COMMENT_TOKEN_${bCount++}___`;
      });

      // 2. Extract line comments
      const isHashComment = ['python', 'py', 'sh', 'bash', 'yaml', 'yml', 'ruby', 'rb', 'dockerfile', 'makefile'].includes(language);
      const lineCommentRegex = isHashComment ? /#.*$/gm : /\/\/.*$/gm;
      let lCount = 0;
      result = result.replace(lineCommentRegex, (match) => {
        commentTokens.push(match);
        return `___LINE_COMMENT_TOKEN_${lCount++}___`;
      });

      // 3. Extract strings
      const stringRegex = /"([^"\\]|\\.)*"|'([^'\\]|\\.)*'/g;
      let sCount = 0;
      result = result.replace(stringRegex, (match) => {
        stringTokens.push(match);
        return `___STRING_TOKEN_${sCount++}___`;
      });

      // 4. Keywords List
      const keywords = [
        "func", "class", "struct", "enum", "protocol", "extension", "let", "var", "import", "return",
        "if", "else", "switch", "case", "default", "for", "while", "do", "try", "catch", "throw", "throws",
        "guard", "defer", "init", "self", "nil", "true", "false", "def", "from", "as", "and", "or", "not",
        "in", "is", "lambda", "with", "yield", "pass", "break", "continue", "const", "function",
        "async", "await", "public", "private", "fileprivate", "internal", "static", "final", "override",
        "typealias", "associatedtype", "where", "package", "void", "int", "float", "double", "char",
        "boolean", "null", "undefined", "print", "console", "log", "string", "number", "bool"
      ];

      // Sort longer keywords first
      const sortedKeywords = [...keywords].sort((a, b) => b.length - a.length);
      for (let keyword of sortedKeywords) {
        const regex = new RegExp(`\\b${keyword}\\b`, 'g');
        result = result.replace(regex, `<span class="keyword">${keyword}</span>`);
      }

      // 5. Highlight Functions
      const functionRegex = /\b([a-zA-Z_][a-zA-Z0-9_]*)\s*(?=\()/g;
      result = result.replace(functionRegex, `<span class="function">$1</span>`);

      // 6. Highlight Capitalized Types/Classes
      const typeRegex = /\b([A-Z][a-zA-Z0-9_]*)\b/g;
      result = result.replace(typeRegex, (match) => {
        if (['HTML', 'CSS', 'URL'].includes(match)) return match;
        return `<span class="type">${match}</span>`;
      });

      // 7. Highlight Numbers
      const numberRegex = /\b(\d+(?:\.\d+)?)\b/g;
      result = result.replace(numberRegex, `<span class="number">$1</span>`);

      // 8. Restore Strings
      for (let i = 0; i < stringTokens.length; i++) {
        result = result.replace(`___STRING_TOKEN_${i}___`, `<span class="string">${stringTokens[i]}</span>`);
      }

      // 9. Restore Comments
      for (let i = 0; i < commentTokens.length; i++) {
        result = result.replace(`___BLOCK_COMMENT_TOKEN_${i}___`, `<span class="comment">${commentTokens[i]}</span>`);
        result = result.replace(`___LINE_COMMENT_TOKEN_${i}___`, `<span class="comment">${commentTokens[i]}</span>`);
      }

      return result;
    }

    function convertMarkdownToHtml(markdown) {
      const lines = markdown.split('\n');
      let htmlLines = [];
      
      let inCodeBlock = false;
      let codeLanguage = '';
      let codeLines = [];
      
      let listType = null;
      let inBlockquote = false;
      let paragraphLines = [];

      function flushList() {
        if (listType) {
          htmlLines.push(`</${listType}>`);
          listType = null;
        }
      }

      function flushBlockquote() {
        if (inBlockquote) {
          htmlLines.push('</blockquote>');
          inBlockquote = false;
        }
      }

      function flushParagraph() {
        if (paragraphLines.length > 0) {
          const text = paragraphLines.join(' ');
          const formatted = parseInlineMarkdown(escapeHtml(text));
          htmlLines.push(`<p>${formatted}</p>`);
          paragraphLines = [];
        }
      }

      function flushAll() {
        flushParagraph();
        flushList();
        flushBlockquote();
      }

      for (let rawLine of lines) {
        const trimmed = rawLine.trim();

        // 1. Code Block Processing
        if (trimmed.startsWith('```')) {
          if (inCodeBlock) {
            inCodeBlock = false;
            const codeText = codeLines.join('\n');
            const escaped = escapeHtml(codeText);
            const highlighted = highlightSyntax(escaped, codeLanguage);
            htmlLines.push(`
            <table style="width: 100%; background-color: #f6f8fa; border: 1px solid #e1e4e8; border-collapse: collapse; margin: 14px 0;">
              <tr>
                <td style="padding: 16px; background-color: #f6f8fa;">
                  <pre style="margin: 0; padding: 0; background: transparent; border: none; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 12px; color: #24292e; line-height: 1.45;">${highlighted}</pre>
                </td>
              </tr>
            </table>
            `);
            codeLines = [];
            codeLanguage = '';
          } else {
            flushAll();
            inCodeBlock = true;
            codeLanguage = trimmed.replace('```', '').trim().toLowerCase();
          }
          continue;
        }

        if (inCodeBlock) {
          codeLines.push(rawLine);
          continue;
        }

        // 2. Empty Line
        if (trimmed === '') {
          flushAll();
          continue;
        }

        // 3. Headers
        if (trimmed.startsWith('#')) {
          let level = 0;
          for (let char of trimmed) {
            if (char === '#') level++;
            else break;
          }
          if (level >= 1 && level <= 6 && trimmed.startsWith('#'.repeat(level) + ' ')) {
            flushAll();
            const headerText = trimmed.substring(level).trim();
            const formatted = parseInlineMarkdown(escapeHtml(headerText));
            htmlLines.push(`<h${level}>${formatted}</h${level}>`);
            continue;
          }
        }

        // 4. Blockquotes
        if (trimmed.startsWith('>')) {
          flushParagraph();
          flushList();
          if (!inBlockquote) {
            inBlockquote = true;
            htmlLines.push('<blockquote>');
          }
          const quoteText = trimmed.substring(1).trim();
          const formatted = parseInlineMarkdown(escapeHtml(quoteText));
          htmlLines.push(`<p>${formatted}</p>`);
          continue;
        } else {
          flushBlockquote();
        }

        // 5. Unordered list
        if (trimmed.startsWith('- ') || trimmed.startsWith('* ') || trimmed.startsWith('+ ')) {
          flushParagraph();
          if (listType !== 'ul') {
            flushList();
            listType = 'ul';
            htmlLines.push('<ul>');
          }
          const itemText = trimmed.substring(2).trim();
          const formatted = parseInlineMarkdown(escapeHtml(itemText));
          htmlLines.push(`<li>${formatted}</li>`);
          continue;
        }

        // 6. Ordered list
        const olMatch = trimmed.match(/^(\d+)\.\s+(.*)$/);
        if (olMatch) {
          flushParagraph();
          if (listType !== 'ol') {
            flushList();
            listType = 'ol';
            htmlLines.push('<ol>');
          }
          const itemText = olMatch[2];
          const formatted = parseInlineMarkdown(escapeHtml(itemText));
          htmlLines.push(`<li>${formatted}</li>`);
          continue;
        }

        // 7. Paragraph accumulate
        flushList();
        paragraphLines.push(rawLine);
      }

      flushAll();
      return htmlLines.join('\n');
    }

    // Wrap content inside the Pages mockup document preview
    function updatePreview(htmlContent) {
      htmlPreview.innerHTML = htmlContent;
    }

    // Global runner to process editor contents
    function runProcessor(force = false) {
      const rawText = markdownInput.value;

      if (!isEnabled && !force) {
        updatePreview(escapeHtml(rawText).replace(/\n/g, '<br>'));
        return;
      }

      if (autoDetect && !force && !isProbablyMarkdown(rawText)) {
        updatePreview(escapeHtml(rawText).replace(/\n/g, '<br>'));
        return;
      }

      const htmlContent = convertMarkdownToHtml(rawText);
      updatePreview(htmlContent);

      if (force) {
        showToast("수동 변환 실행", "클립보드가 수동 변환되었습니다.");
      }
    }

    // Auto run on input edit
    markdownInput.addEventListener('input', () => runProcessor(false));

    // Initial render
    runProcessor(false);

    // --- Clipboard Writeback (Actual Copy rich text action) ---
    realCopyButton.addEventListener('click', async () => {
      const plainText = markdownInput.value;
      const htmlContent = convertMarkdownToHtml(plainText);

      // Wrapper HTML for Pages/Notes compatibility (containing embedded CSS style tag)
      const fullHtmlString = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="utf-8">
          <style>
            body { font-family: -apple-system, sans-serif; font-size: 14px; line-height: 1.6; color: #1a1a1a; }
            h1 { font-size: 24px; border-bottom: 1px solid #eaecef; padding-bottom: 8px; color: #111; }
            h2 { font-size: 20px; border-bottom: 1px solid #eaecef; padding-bottom: 6px; color: #222; }
            h3 { font-size: 16px; color: #333; }
            blockquote { border-left: 4px solid #dfe2e5; padding: 0 12px; color: #6a737d; background: #f6f8fa; margin: 12px 0; }
            code { font-family: monospace; background: rgba(27,31,35,0.05); color: #d63384; padding: 2px 4px; border-radius: 3px; }
            pre { background: #f6f8fa; border: 1px solid #e1e4e8; padding: 16px; border-radius: 6px; overflow-x: auto; color: #24292e; }
            .keyword { color: #d73a49; font-weight: bold; }
            .string { color: #032f62; }
            .number { color: #005cc5; }
            .comment { color: #6a737d; font-style: italic; }
            .function { color: #6f42c1; }
            .type { color: #e36209; }
          </style>
        </head>
        <body>
          ${htmlContent}
        </body>
        </html>
      `;

      try {
        const textBlob = new Blob([plainText], { type: 'text/plain' });
        const htmlBlob = new Blob([fullHtmlString], { type: 'text/html' });

        const clipboardItem = new ClipboardItem({
          'text/plain': textBlob,
          'text/html': htmlBlob
        });

        await navigator.clipboard.write([clipboardItem]);
        showToast("클립보드 저장 완료", "변환된 서식이 실제 시스템 클립보드에 복사되었습니다! Pages나 메모 앱에 붙여넣어 보세요.");
      } catch (err) {
        console.error("클립보드 접근 오류:", err);
        // Fallback for simple copy
        try {
          await navigator.clipboard.writeText(plainText);
          showToast("일반 텍스트 복사", "브라우저 권한 제한으로 일반 텍스트로만 복사되었습니다.");
        } catch (e) {
          showToast("복사 실패", "클립보드 복사 도중 에러가 발생했습니다.");
        }
      }
    });
  </script>
</body>
